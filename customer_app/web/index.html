<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Book trusted home services on demand — cleaning, repairs, beauty, and more with DODO Booker.">
  <meta name="theme-color" content="#111111">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DODO Booker">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <!-- Razorpay Web Checkout -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <title>DODO Booker</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Register the DODO service worker. Must happen before Flutter loads so
    // that the service worker can activate before Chrome evaluates PWA
    // installability (beforeinstallprompt fires only after SW activation).
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js').catch(function(err) {
        console.warn('SW registration failed:', err);
      });
    }

    window._deferredInstallPrompt = null;
    window._pwaInstallAvailable = false;

    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window._deferredInstallPrompt = e;
      window._pwaInstallAvailable = true;
    });

    window.addEventListener('appinstalled', function() {
      window._deferredInstallPrompt = null;
      window._pwaInstallAvailable = false;
    });

    // Called from Flutter via dart:js_interop.
    window._getPwaInstallAvailable = function() {
      return window._pwaInstallAvailable === true;
    };

    window._getPwaIsStandalone = function() {
      try {
        return window.matchMedia('(display-mode: standalone)').matches ||
               window.matchMedia('(display-mode: fullscreen)').matches;
      } catch(e) { return false; }
    };

    // Returns a Promise resolving to 'accepted', 'dismissed', or 'unavailable'.
    window.triggerPwaInstall = function() {
      if (!window._deferredInstallPrompt) {
        return Promise.resolve('unavailable');
      }
      var prompt = window._deferredInstallPrompt;
      window._deferredInstallPrompt = null;
      window._pwaInstallAvailable = false;
      prompt.prompt();
      return prompt.userChoice.then(function(choice) {
        return choice.outcome;
      }).catch(function() {
        return 'error';
      });
    };
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
